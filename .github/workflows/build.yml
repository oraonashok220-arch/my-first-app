name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Build with Buildozer
      uses: ArtemShedov/buildozer-action@v1.2
      with:
        command: buildozer android debug
        subfolder: .

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: my-app-apk
        path: bin/*.apk
